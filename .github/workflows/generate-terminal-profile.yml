name: Generate terminal profile GIF

on:
  push:
    branches:
      - main
    paths:
      - "gerar_gif.py"
      - "assets/portrait.txt"
      - ".github/workflows/generate-terminal-profile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Generate animated GIF
        run: python gerar_gif.py
      - name: Commit generated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal_profile.gif
          if git diff --cached --quiet; then
            echo "GIF is already up to date."
          else
            git commit -m "build: regenerate terminal profile GIF"
            git push origin HEAD:main
          fi
