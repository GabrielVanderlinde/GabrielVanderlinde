name: Generate terminal profile GIF

on:
  push:
    branches:
      - main
    paths:
      - "gerar_gif.py"
      - "assets/portrait.txt"
      - ".github/workflows/generate-terminal-profile.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * 1"

concurrency:
  group: terminal-profile-gif
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow and GIF optimizer
        run: |
          python -m pip install --upgrade Pillow
          sudo apt-get update
          sudo apt-get install --yes gifsicle
      - name: Generate animated GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python gerar_gif.py
      - name: Commit generated animation safely
        run: |
          set -euo pipefail
          generated_gif="$(mktemp)"
          generated_portrait="$(mktemp)"
          cp assets/terminal_profile.gif "$generated_gif"
          cp assets/readme_ascii_portrait.svg "$generated_portrait"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$generated_gif" assets/terminal_profile.gif
            cp "$generated_portrait" assets/readme_ascii_portrait.svg
            git add assets/terminal_profile.gif assets/readme_ascii_portrait.svg
            if git diff --cached --quiet; then
              echo "GIF is already up to date."
              rm -f "$generated_gif" "$generated_portrait"
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: regenerate terminal profile GIF"
            if git push origin HEAD:main; then
              rm -f "$generated_gif"
              exit 0
            fi
            echo "Push raced with another commit; retrying ($attempt/5)."
            git reset --hard origin/main
            sleep 2
          done
          rm -f "$generated_gif" "$generated_portrait"
          echo "Could not publish GIF and portrait after 5 attempts." >&2
          exit 1
